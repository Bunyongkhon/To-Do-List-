
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <main class="min-h-screen flex justify-center items-center p-5">

        <div class="bg-white w-full max-w-lg rounded-xl shadow-lg p-6">

            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">
                    My To-Do List
                </h1>

                <p class="text-gray-500 mt-2">
                    Organize your daily tasks
                </p>
            </div>

            <section class="flex gap-2 mb-6">

                <input
                    id="input"
                    type="text"
                    placeholder="Enter your task..."
                    class="flex-1 min-w-0 border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500"
                >

                <button
                    type="button"
                    id="buttonAdd"
                    class="bg-blue-600 text-white font-semibold px-5 rounded-lg hover:bg-blue-700 transition cursor-pointer hover:-translate-y-1"
                >
                    + Add
                </button>

            </section>

            <section class="flex gap-2 pb-5">
                <button type="button" class="btnFilter bg-blue-600 text-white rounded-lg px-4 py-2 cursor-pointer"
                        data-filter="all">
                    All
                </button>
                <button type="button" class="btnFilter bg-gray-200 rounded-lg px-4 py-2 text-gray-700 cursor-pointer"
                        data-filter="active">
                    Active
                </button>

                <button type="button" class="btnFilter bg-gray-200 rounded-lg px-4 py-2 text-gray-700 cursor-pointer"
                        data-filter="done">
                    Done
                </button>

            </section>
            <section>
                

                <h2 class="font-semibold text-gray-700 mb-3">
                    Your Tasks
                </h2>

                <ul id="listTask" class="space-y-2 max-h-[300px] overflow-y-auto">

                </ul>

            </section>

            

        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
