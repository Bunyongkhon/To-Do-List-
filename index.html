<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <main>
       <div class="flex justify-center items-center h-screen">
            <form class="grid p-5 bg-gray-600 items-center justify-center flex-wrap w-[500px] rounded">
                <h1 class="text-blue-500 font-bold underline text-[22px]">To-Do List</h1>
                <section class="flex gap-2 mb-4">
                    <input id="input" type="text" placeholder="Enter some task" class="bg-white rounded p-2 flex-1">
                    <button type="button" id="buttonAdd" class="rounded bg-green-500 p-1 font-bold cursor-pointer hover:-translate-y-1">+ADD</button>
                </section>
                <section>
                    <ul id="listTask">

                    </ul>
                </section>
            </form>
       </div>
       <script src="app.js"></script>
    </main>
</body>
</html>
